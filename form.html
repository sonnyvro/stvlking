<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Beat | stvlking</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #121212;
            --accent: #ff0033;
            --text: #e0e0e0;
            --text-dim: #888;
            --border: #222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 640px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 40px;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.75rem;
            letter-spacing: 3px;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 32px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width { grid-column: 1 / -1; }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea { resize: vertical; min-height: 120px; }

        select { appearance: none; cursor: pointer; }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 24px;
            background: var(--accent);
            border: none;
            border-radius: 4px;
            color: #fff;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.85; }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .container { padding: 24px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Request a Beat</h1>
        <p class="subtitle">Tell me what you're looking for.</p>

        <form action="https://formspree.io/f/YOUR_FORMSPREE_ID_HERE" method="POST">
            <div class="form-grid">
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="full-width">
                    <label for="vibe">Vibe</label>
                    <select name="vibe" id="vibe" required>
                        <option value="" disabled selected>Select one</option>
                        <option value="dark-trap">Dark / Aggressive Trap</option>
                        <option value="ambient">Ambient / Cinematic</option>
                        <option value="alternative">Alternative / Gritty</option>
                        <option value="custom">Other (describe below)</option>
                    </select>
                </div>

                <div>
                    <label for="bpm">Target BPM (optional)</label>
                    <input type="text" id="bpm" name="bpm">
                </div>
                <div>
                    <label for="references">References (optional)</label>
                    <input type="url" id="references" name="references">
                </div>

                <div class="full-width">
                    <label for="message">Details</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
            </div>

            <button type="submit">Send</button>
        </form>
    </div>
</body>
</html>
